<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Extranalyzer</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/vendor/chart.umd.min.js"></script>
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <section id="login" class="login" hidden>
    <form id="login-form" class="login-card">
      <h1>Extranalyzer</h1>
      <label for="password">Mot de passe</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Se connecter</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="bar">
      <div class="bar-row">
        <strong class="brand">Extranalyzer</strong>
        <button id="unclassified" type="button" class="pill" disabled>À classer (0)</button>
        <button id="bank-alert" type="button" class="pill alert" hidden></button>
        <label class="button upload">
          Déposer un relevé
          <input id="upload-input" type="file" accept="application/pdf,.pdf" multiple hidden>
        </label>
        <div class="privacy" role="group" aria-label="Masquage des montants">
          <button id="privacy-toggle" type="button" class="privacy-toggle" aria-pressed="false">Masquer les montants</button>
          <details id="privacy-menu" class="privacy-menu">
            <summary aria-label="Choisir les montants affichés" title="Choisir les montants affichés">▾</summary>
            <div id="privacy-list" class="privacy-list"></div>
          </details>
        </div>
        <button id="logout" type="button" class="link">Déconnexion</button>
      </div>
      <div class="bar-row period">
        <label>Du <input id="period-from" type="date"></label>
        <label>au <input id="period-to" type="date"></label>
        <div class="shortcuts" role="group" aria-label="Raccourcis de période">
          <button type="button" data-shortcut="month">Mois</button>
          <button type="button" data-shortcut="quarter">Trimestre</button>
          <button type="button" data-shortcut="year">Année</button>
          <button type="button" data-shortcut="all">Tout</button>
        </div>
        <label>Comparer à
          <select id="compare">
            <option value="none">aucune</option>
            <option value="previous">période précédente</option>
            <option value="yoy">même période N−1</option>
          </select>
        </label>
        <details id="accounts" class="accounts">
          <summary>Comptes courants</summary>
          <div id="accounts-list" class="accounts-list"></div>
        </details>
      </div>
      <nav id="tabs" class="tabs" aria-label="Onglets"></nav>
    </header>
    <main id="tab-container" class="content"></main>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
