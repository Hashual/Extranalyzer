services:
  extranalyzer:
    # IMAGE (.env) : ghcr.io/<compte>/<dépôt> pour l'image publiée par GitHub ; par défaut, image construite en local
    image: ${IMAGE:-extranalyzer}:${IMAGE_TAG:-arm64}
    build: .
    ports:
      - "${BIND_ADDR:?BIND_ADDR requis (IP WireGuard/LAN du Pi)}:8000:8000"
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=64m
    secrets:
      - password
      - gmail_app_password
    environment:
      EXTRANALYZER_PASSWORD_FILE: /run/secrets/password
      EXTRANALYZER_GMAIL_APP_PASSWORD_FILE: /run/secrets/gmail_app_password
      EXTRANALYZER_GMAIL_USER: ${GMAIL_USER:-}
      EXTRANALYZER_RECEIPT_LABELS: ${RECEIPT_LABELS:-Super U/Tickets de caisses=superu;intermarche/Tickets de caisses=intermarche}
    read_only: true
    mem_limit: 256m
    cpus: 1.0
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "3"

secrets:
  password:
    file: ./secrets/password.txt
  gmail_app_password:
    file: ./secrets/gmail_app_password.txt

volumes:
  data:
